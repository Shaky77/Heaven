<script data-page-node-id="fSCFWd9ZbHs4n2Oowqr1iA" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script data-page-node-id="MIXHwUeQPNlaypSiFawLcv" src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script data-page-node-id="eVSETxBV9WPc0kProUYYQ3" data-pnid-children="p2vsfyixzJSoGzxm3i5qkh">
(function(){
  const app=document.getElementById('app');
  const scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x000008,0.008);
  const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,0.1,2000);
  camera.position.set(28,16,46);
  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  app.appendChild(renderer.domElement);

  const controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.06;
  controls.autoRotate=true; controls.autoRotateSpeed=0.7;
  controls.minDistance=24; controls.maxDistance=160;
  controls.target.set(0,0,0);

  function glow(rgb){
    const s=64,c=document.createElement('canvas');c.width=c.height=s;
    const g=c.getContext('2d');
    const grd=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    grd.addColorStop(0,'rgba(255,255,255,1)');grd.addColorStop(0.25,rgb);grd.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=grd;g.fillRect(0,0,s,s);return new THREE.CanvasTexture(c);
  }
  const tGold=glow('rgba(255,196,90,0.95)');
  const tGreen=glow('rgba(110,231,183,0.95)');
  const tPink=glow('rgba(255,155,212,0.95)');
  const tWhite=glow('rgba(255,244,210,1)');

  const RX=14, RY=4.6, RZ=4.6; // 橄榄球半轴：长轴沿 X

  // 橄榄球壳（半透明面 + 线框，几何感）
  const ballGroup=new THREE.Group();
  const shell=new THREE.Mesh(
    new THREE.SphereGeometry(1,40,28),
    new THREE.MeshBasicMaterial({color:0x4a6fa5,transparent:true,opacity:0.10,depthWrite:false})
  );
  shell.scale.set(RX,RY,RZ);
  const shellW=new THREE.Mesh(
    new THREE.SphereGeometry(1,24,16),
    new THREE.MeshBasicMaterial({color:0x6f8fc0,wireframe:true,transparent:true,opacity:0.08,depthWrite:false})
  );
  shellW.scale.set(RX,RY,RZ);
  ballGroup.add(shell,shellW);

  // S 节点（左端奇点）
  const Snode=new THREE.Mesh(new THREE.SphereGeometry(1.6,32,32),new THREE.MeshBasicMaterial({color:0xffcf6e}));
  Snode.position.set(-RX,0,0);
  const sHalo=new THREE.Sprite(new THREE.SpriteMaterial({map:tGold,color:0xffd98a,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false}));
  sHalo.scale.set(7,7,1); sHalo.position.copy(Snode.position);
  ballGroup.add(Snode,sHalo);

  // D 节点（右端奇点）
  const Dnode=new THREE.Mesh(new THREE.SphereGeometry(1.6,32,32),new THREE.MeshBasicMaterial({color:0x6ee7b7}));
  Dnode.position.set(RX,0,0);
  const dHalo=new THREE.Sprite(new THREE.SpriteMaterial({map:tGreen,color:0x9af0c8,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false}));
  dHalo.scale.set(7,7,1); dHalo.position.copy(Dnode.position);
  ballGroup.add(Dnode,dHalo);

  // S–D 中间链（连杆）
  const link=new THREE.Mesh(
    new THREE.CylinderGeometry(0.12,0.12,RX*2,8),
    new THREE.MeshBasicMaterial({color:0xc9b8ff,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false})
  );
  link.rotation.z=Math.PI/2; // 沿 X 轴
  ballGroup.add(link);

  // H 滑块（在中间链上滑动）
  const Hslider=new THREE.Mesh(new THREE.SphereGeometry(0.95,24,24),new THREE.MeshBasicMaterial({color:0xff9bd4}));
  const hHalo=new THREE.Sprite(new THREE.SpriteMaterial({map:tPink,color:0xffb0dd,transparent:true,opacity:0.7,blending:THREE.AdditiveBlending,depthWrite:false}));
  hHalo.scale.set(5,5,1);
  ballGroup.add(Hslider,hHalo);

  // M 稳态收敛点（中心下方小绿点，代表稳态结果）
  const Mnode=new THREE.Mesh(new THREE.SphereGeometry(0.7,20,20),new THREE.MeshBasicMaterial({color:0x9affc8}));
  Mnode.position.set(0,-RY-2.5,0);
  const mHalo=new THREE.Sprite(new THREE.SpriteMaterial({map:glow('rgba(154,255,200,0.95)'),color:0xbfffd8,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false}));
  mHalo.scale.set(4,4,1); mHalo.position.copy(Mnode.position);
  ballGroup.add(Mnode,mHalo);

  scene.add(ballGroup);

  // R 垂直恒定轴（不随球旋转，绝对参照）
  const Raxis=new THREE.Mesh(
    new THREE.CylinderGeometry(0.18,0.18,90,12),
    new THREE.MeshBasicMaterial({color:0xfff2cc})
  );
  scene.add(Raxis);
  [{r:3,op:0.4},{r:6,op:0.18}].forEach(h=>{
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tWhite,color:0xffe2a0,transparent:true,opacity:h.op,blending:THREE.AdditiveBlending,depthWrite:false}));
    sp.scale.set(h.r*2,h.r*2,1); scene.add(sp);
  });

  // 背景星尘
  const bgN=1300,bgp=new Float32Array(bgN*3);
  for(let i=0;i<bgN;i++){
    const r=140+Math.random()*320,a=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);
    bgp[i*3]=r*Math.sin(p)*Math.cos(a);bgp[i*3+1]=r*Math.cos(p);bgp[i*3+2]=r*Math.sin(p)*Math.sin(a);
  }
  const bgGeo=new THREE.BufferGeometry();bgGeo.setAttribute('position',new THREE.BufferAttribute(bgp,3));
  scene.add(new THREE.Points(bgGeo,new THREE.PointsMaterial({size:0.7,color:0x6678aa,transparent:true,opacity:0.5})));

  const clock=new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt=clock.getDelta(),t=clock.elapsedTime;
    ballGroup.rotation.x+=dt*0.25; // 橄榄球自转（绕长轴，端点奇点不动）
    ballGroup.rotation.y+=dt*0.08;

    // H 在 S–D 中间链上滑动（局部 X 轴往复）
    const hx=Math.sin(t*0.9)*RX*0.7;
    Hslider.position.set(hx,0,0);
    hHalo.position.set(hx,0,0);
    // H 越偏向 D，D 越被放大（制衡），偏向 S，S 越被放大
    const dToD=(RX-hx)/(2*RX), dToS=(RX+hx)/(2*RX);
    Dnode.scale.setScalar(1+dToD*0.5);
    Snode.scale.setScalar(1+dToS*0.5);

    // M 稳态点轻微脉动
    Mnode.scale.setScalar(1+Math.sin(t*1.4)*0.12);

    controls.update();
    renderer.render(scene,camera);
  }
  animate();
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
})();
</script>
