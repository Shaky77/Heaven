<script data-page-node-id="FSvUKBhyjRCVftWjdyMyDh" data-pnid-children="1ovA6zt7U8KiUK1tg4AQYT" type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script data-page-node-id="txJdHs4qxHlwECQv9ELOTI" data-pnid-children="e2YosoVuXXXzpY6Ci8x9KW" type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x05060a, 0.011);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 1000);
camera.position.set(2, 5, 34);
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

scene.add(new THREE.AmbientLight(0x4060a0, 0.6));
const p1 = new THREE.PointLight(0xffe0a0, 1.3, 200); p1.position.set(20,30,20); scene.add(p1);
const p2 = new THREE.PointLight(0x60a0ff, 0.9, 200); p2.position.set(-20,-12,-20); scene.add(p2);

// 中轴（演化轴 / 时间）
const Hgt = 26, N = 26, step = Hgt/N, radius = 3.2, twist = 0.42;
const axis = new THREE.Mesh(
  new THREE.CylinderGeometry(0.05,0.05, Hgt, 8),
  new THREE.MeshBasicMaterial({color:0x2a3550, transparent:true, opacity:0.45})
);
scene.add(axis);

const group = new THREE.Group();
scene.add(group);

const nodes = [];
const dParticles = [];
const easeOut = t => 1-Math.pow(1-t,3);
const easeIn  = t => t*t;

function makeNode(i){
  const angle = i*twist, y = -Hgt/2 + i*step;
  const ng = new THREE.Group(); ng.position.y = y; ng.rotation.y = angle;
  const mat = new THREE.MeshStandardMaterial({color:0x39435c, metalness:0.3, roughness:0.75});
  // 横档（沿 X）
  const rung = new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08, radius*2, 8), mat);
  rung.rotation.z = Math.PI/2; ng.add(rung);
  // 末端配对球（碱基对）
  const ballA = new THREE.Mesh(new THREE.SphereGeometry(0.27,16,16), mat.clone()); ballA.position.x =  radius; ng.add(ballA);
  const ballB = new THREE.Mesh(new THREE.SphereGeometry(0.27,16,16), mat.clone()); ballB.position.x = -radius; ng.add(ballB);
  // H 滑块（沿横档滑动）
  const slider = new THREE.Mesh(new THREE.SphereGeometry(0.17,12,12), new THREE.MeshBasicMaterial({color:0xff9ed2}));
  ng.add(slider);
  group.add(ng);
  return {ng, rung, ballA, ballB, slider, y, t0:i*0.42, lit:false};
}

for(let i=0;i<N;i++) nodes.push(makeNode(i));

function spawnD(node){
  const d = new THREE.Mesh(new THREE.SphereGeometry(0.22,12,12), new THREE.MeshBasicMaterial({color:0x5fa8ff}));
  const start = new THREE.Vector3(radius*2.8, node.y, 0);
  const target = new THREE.Vector3(0, node.y, 0);
  d.position.copy(start);
  group.add(d);
  dParticles.push({mesh:d, start, target, p:0});
}

function litNode(node){
  node.lit = true;
  [node.rung, node.ballA, node.ballB].forEach(m=>{
    m.material.color.set(0xffd166);
    m.material.emissive.set(0xb8860b);
    m.material.emissiveIntensity = 0.9;
  });
  spawnD(node);
}

let startT = 0, spin = true;
const clock = new THREE.Clock();

function update(){
  const e = clock.getElapsedTime() - startT;
  for(const node of nodes){
    if(!node.lit && e > node.t0) litNode(node);
    if(node.lit){
      const k = Math.min(1, (e - node.t0)/0.85);
      node.slider.position.x = THREE.MathUtils.lerp(0, radius*0.9, easeOut(k));
    }
  }
  for(let i=dParticles.length-1; i>=0; i--){
    const dp = dParticles[i];
    dp.p = Math.min(1, dp.p + 0.022);
    dp.mesh.position.lerpVectors(dp.start, dp.target, easeIn(dp.p));
    dp.mesh.scale.setScalar(1 - dp.p*0.6);
    if(dp.p >= 1){
      group.remove(dp.mesh); dp.mesh.geometry.dispose(); dp.mesh.material.dispose();
      dParticles.splice(i,1);
    }
  }
  if(spin) group.rotation.y += 0.0035;
  axis.rotation.y = group.rotation.y;
}

function animate(){
  requestAnimationFrame(animate);
  update();
  controls.update();
  renderer.render(scene, camera);
}
animate();

document.getElementById('btnSpin').onclick = (ev)=>{
  spin = !spin; ev.target.textContent = '自转：' + (spin?'开':'关');
};
document.getElementById('btnReplay').onclick = ()=>{
  startT = clock.getElapsedTime();
  nodes.forEach(n=>{
    n.lit = false; n.slider.position.x = 0;
    [n.rung,n.ballA,n.ballB].forEach(m=>{ m.material.color.set(0x39435c); m.material.emissive.set(0x000000); m.material.emissiveIntensity = 0; });
  });
  dParticles.forEach(dp=>{ group.remove(dp.mesh); dp.mesh.geometry.dispose(); dp.mesh.material.dispose(); });
  dParticles.length = 0;
};

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
