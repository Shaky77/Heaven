<script data-page-node-id="BqBSYN9tK7lWE11Rm8vbav" src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script data-page-node-id="mpPWxrzv2LlZXwyV2FUGon" src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script data-page-node-id="qmw48P5smRQiFt9VmP0Yae" data-pnid-children="Qalgg5LIjJppVf9NcVVXDc">
(function(){
  const app = document.getElementById('app');
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000008, 0.012);

  const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 2000);
  camera.position.set(0, 14, 46);

  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false});
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  app.appendChild(renderer.domElement);

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.6;
  controls.minDistance = 18;
  controls.maxDistance = 120;

  // ---- 生成圆形发光纹理 ----
  function glowTexture(rgb){
    const s=64, c=document.createElement('canvas'); c.width=c.height=s;
    const g=c.getContext('2d');
    const grd=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    grd.addColorStop(0,'rgba(255,255,255,1)');
    grd.addColorStop(0.25, rgb);
    grd.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=grd; g.fillRect(0,0,s,s);
    return new THREE.CanvasTexture(c);
  }
  const texGold = glowTexture('rgba(255,196,90,0.95)');
  const texBlue = glowTexture('rgba(95,160,255,0.9)');
  const texWhite = glowTexture('rgba(255,244,210,1)');

  // ---- R 核心：稳定存续不变量 ----
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(3.0, 48, 48),
    new THREE.MeshBasicMaterial({color:0xfff2cc})
  );
  scene.add(core);

  // 核心多层光晕
  const halos = [];
  [{r:5.0,op:0.55},{r:8.0,op:0.30},{r:12.0,op:0.15}].forEach((h,i)=>{
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({
      map:texWhite, color:0xffe2a0, transparent:true, opacity:h.op,
      blending:THREE.AdditiveBlending, depthWrite:false
    }));
    sp.scale.set(h.r*2, h.r*2, 1);
    halos.push(sp); scene.add(sp);
  });

  // ---- 戴森球壳层 (Wireframe) ----
  const shell = new THREE.Mesh(
    new THREE.IcosahedronGeometry(20, 2),
    new THREE.MeshBasicMaterial({color:0x8a93a8, wireframe:true, transparent:true, opacity:0.10})
  );
  scene.add(shell);
  const shell2 = new THREE.Mesh(
    new THREE.IcosahedronGeometry(20, 1),
    new THREE.MeshBasicMaterial({color:0x4a90e2, wireframe:true, transparent:true, opacity:0.06})
  );
  scene.add(shell2);

  // ---- S 粒子流：积累向 R 对齐 (金色, 向内螺旋) ----
  const S_N = 2600;
  const sGeo = new THREE.BufferGeometry();
  const sPos = new Float32Array(S_N*3);
  const sData = []; // {r, theta, phi, speed, inward}
  for(let i=0;i<S_N;i++){
    const r = 16 + Math.random()*5;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos(2*Math.random()-1);
    sData.push({r, theta, phi, spin:0.002+Math.random()*0.004,
                inward:0.012+Math.random()*0.02});
    const x=r*Math.sin(phi)*Math.cos(theta), y=r*Math.cos(phi), z=r*Math.sin(phi)*Math.sin(theta);
    sPos[i*3]=x; sPos[i*3+1]=y; sPos[i*3+2]=z;
  }
  sGeo.setAttribute('position', new THREE.BufferAttribute(sPos,3));
  const sMat = new THREE.PointsMaterial({size:0.9, map:texGold, color:0xffcf6e,
    transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false});
  const sPoints = new THREE.Points(sGeo, sMat);
  scene.add(sPoints);

  // ---- H 粒子流：情感/耗散 (蓝色, 向外上升消散) ----
  const H_N = 1200;
  const hGeo = new THREE.BufferGeometry();
  const hPos = new Float32Array(H_N*3);
  const hData = [];
  function resetH(k){
    const r = 2 + Math.random()*3;
    const theta = Math.random()*Math.PI*2;
    const phi = Math.acos(2*Math.random()-1);
    hData[k] = {r, theta, phi, rise:0.06+Math.random()*0.10, life:0};
    hPos[k*3]=r*Math.sin(phi)*Math.cos(theta);
    hPos[k*3+1]=r*Math.cos(phi);
    hPos[k*3+2]=r*Math.sin(phi)*Math.sin(theta);
  }
  for(let i=0;i<H_N;i++) resetH(i);
  hGeo.setAttribute('position', new THREE.BufferAttribute(hPos,3));
  const hMat = new THREE.PointsMaterial({size:1.1, map:texBlue, color:0x7fb4ff,
    transparent:true, opacity:0.7, blending:THREE.AdditiveBlending, depthWrite:false});
  const hPoints = new THREE.Points(hGeo, hMat);
  scene.add(hPoints);

  // ---- 星尘背景 ----
  const bgGeo = new THREE.BufferGeometry();
  const bgN=1400, bgp=new Float32Array(bgN*3);
  for(let i=0;i<bgN;i++){
    const r=120+Math.random()*300, t=Math.random()*Math.PI*2, p=Math.acos(2*Math.random()-1);
    bgp[i*3]=r*Math.sin(p)*Math.cos(t); bgp[i*3+1]=r*Math.cos(p); bgp[i*3+2]=r*Math.sin(p)*Math.sin(t);
  }
  bgGeo.setAttribute('position', new THREE.BufferAttribute(bgp,3));
  scene.add(new THREE.Points(bgGeo, new THREE.PointsMaterial({
    size:0.7, color:0x6678aa, transparent:true, opacity:0.5})));

  // ---- 动画 ----
  const clock = new THREE.Clock();
  function animate(){
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    const t = clock.elapsedTime;

    // 核心脉动
    const pulse = 1 + Math.sin(t*1.6)*0.04;
    core.scale.setScalar(pulse);
    halos.forEach((h,i)=> h.scale.setScalar((5 + i*3.5)*2*(1+Math.sin(t*1.6+i)*0.03)));

    // 壳旋转
    shell.rotation.y += dt*0.05; shell.rotation.x += dt*0.02;
    shell2.rotation.y -= dt*0.035; shell2.rotation.z += dt*0.02;

    // S 向内螺旋对齐 R
    const sp = sGeo.attributes.position.array;
    for(let i=0;i<S_N;i++){
      const d=sData[i];
      d.r -= d.inward; d.theta += d.spin;
      if(d.r <= 3.2){ // 抵达核心 -> 重置到外圈 (循环积累)
        d.r = 16 + Math.random()*5; d.theta = Math.random()*Math.PI*2;
        d.phi = Math.acos(2*Math.random()-1);
      }
      sp[i*3]   = d.r*Math.sin(d.phi)*Math.cos(d.theta);
      sp[i*3+1] = d.r*Math.cos(d.phi);
      sp[i*3+2] = d.r*Math.sin(d.phi)*Math.sin(d.theta);
    }
    sGeo.attributes.position.needsUpdate = true;

    // H 向外上升消散
    const hp = hGeo.attributes.position.array;
    for(let i=0;i<H_N;i++){
      const d=hData[i];
      d.r += d.rise; d.phi += dt*0.3; d.life += dt;
      hp[i*3]   = d.r*Math.sin(d.phi)*Math.cos(d.theta);
      hp[i*3+1] = d.r*Math.cos(d.phi) + d.life*1.2; // 上升
      hp[i*3+2] = d.r*Math.sin(d.phi)*Math.sin(d.theta);
      if(d.r > 60 || hp[i*3+1] > 60) resetH(i);
    }
    hGeo.attributes.position.needsUpdate = true;

    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
